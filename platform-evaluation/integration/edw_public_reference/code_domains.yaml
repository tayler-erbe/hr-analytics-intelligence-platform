# --------------------------------------------------------------------------------------------- rank and tenure
tenure_code:
  source: tenure2008
  confidence: high
  values: {A: Indefinite Tenure, L: Initial/Partial Term MYC, M: Multi-Year Contract Agreement, N: Initial/Partial Term, P: Probationary/On Tenure Track, Q: Q Probation, T: Terminal Year, X: Terminal MYC}
  current_kb_subset: {source: kb120574, values: {A: Indefinite Tenure, N: Initial/Partial Term, P: Probationary/On Tenure Track, Q: Q Probation}}
  reporting_rules: {source: rc2009, tenured: "E-Class begins with A, Tenure Code = A", tenure_track: "Tenure Code = P or Q", non_tenured: "Tenure Code = N"}
  drift: "L, M, T, X appear in the 2008 job aid but not in the 2026 KB article."
institutional_rank_code:
  source: tenure2008
  confidence: high
  values: {"1": Professor, "2": Associate Professor, "3": Assistant Professor, "4": Research Professor, "5": Research Associate Professor, "6": Research Assistant Professor, "9": Unreported, A: Administrative}
  current_kb_subset: {source: kb120574, values: ["1", "2", "3", "4", "5", A]}

# --------------------------------------------------------------------------------------------- salary tables
salary_table_code:
  source: rc2009
  confidence: high
  columns: ["T_POSN_HIST: Position Salary Table Code", "V_JOB_DETL_HIST_1: Job Detail Salary Table Code"]
  open_range: {CA: Chicago, DA: Springfield, EA: Urbana}
  open_range_pilot: {CB: Chicago, DB: Springfield}
  established: {rule: "begins with T"}
  prevailing: {rule: "begins with Q (Chicago), R (Springfield) or S (Urbana)"}
  negotiated: {rule: "begins with G (Chicago), K (Springfield) or M (Urbana)"}
  note: "Salary table CA/CB/DA/DB are different code domains from E-Class CA/CB/DA/DB; same letters, different columns."
  related: {salary_grade: "Position Salary Grade Code / Job Detail Salary Grade Code", range_min: T_POSN_HIST.POSN_MIN_SAL, range_max: T_POSN_HIST.POSN_MAX_SAL}

