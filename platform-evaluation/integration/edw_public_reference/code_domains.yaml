# --------------------------------------------------------------------------------------------- jobs
job_type:
  source: rc2009
  confidence: high
  values: {P: Primary Job, O: Overload Job}
  rules: ["Overload jobs with a 0 FTE are excluded from headcount and FTE reporting", "headcount is reported by active employees' primary job"]
  secondary_note: {source: snip_fte_cube_2023, text: "Contract Primary Job Ind: Primary (Y) or Secondary/Overload (N)", confidence: low}
  v1_value_S: "The v1 sample also uses S (secondary). S is not in the public sources read here; kept as an unresolved value."
job_suffix:
  source: snip_hr_nbajobs
  confidence: low
  rules: ["first job on a position has suffix '00', the second '01', and so on", "jobs with E-Class MM or LP, or a suffix beginning with T, must have job type Overload"]
  link_rules: {source: rc2009, confidence: high, bargaining_unit: "Position History and Job tables linked by position number and job suffix", payroll_hours: "Payroll Accounting Detail Public linked by Position Number and Job Suffix"}
fte:
  source: rc2009
  confidence: high
  rules:
    - "Civil Service employees working 37.5, 40 or 42 hours per week are all considered 1 FTE"
    - "Actual FTE Worked = Job FTE * Appointment Percent"
    - "Annualized Salary = (1.0 FTE / Job FTE) * Job annual salary * (Job FTE * ApptPct)"
    - "Position FTE is the FTE of the position; Job FTE is the FTE of the job (footnote 10)"
    - "FTE reports normally exclude Extra Help, temporary employees, one time payments, summer pay, lump sum payments and 0-FTE overload jobs"
  snippet_rule: {source: snip_hr_nbajobs, confidence: low, text: "total FTE of all active jobs for an employee should not be greater than 1 (not including summer jobs with E-class of 'MM')"}
