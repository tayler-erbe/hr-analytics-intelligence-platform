  code_letters: "A/T letters are the v1 sample's; the public source gives only the description 'Terminated'."
employee_status:
  source: rc2009
  confidence: high
  rule: "Active employee (including on leave): Employee Status Code <> T; excluding leave: Employee Status Code = A"
  values: {A: Active, T: Terminated}
  note: Leave status letters exist but are not listed in public sources read here.
position_status:
  source: rc2009
  confidence: high
  description_values: [Active, Inactive, Frozen, Cancelled]
  rules: {active: "Position Status Description = 'Active'", include_frozen_inactive: "Position Status Description <> 'Cancelled'", vacant_candidates: "'Active' or 'Inactive'"}
  code_letters: "Position Status Code letters (v1 uses A/I) are not in public sources."
position_type:
