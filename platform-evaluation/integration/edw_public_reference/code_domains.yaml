# --------------------------------------------------------------------------------------------- P-Class
p_class:
  description: Five-character position class code. Found at position class (T_POSN_CLS_HIST), position (Position History) and job (Job Detail History 1) level; academic job P-Class may differ from the position's (interim, acting, adjunct, visiting, emeritus, retire/rehire); civil service P-Class should not differ (rc2009 footnote 7).
  source: kb120569
  confidence: high
  faculty_and_other_academics:
    positions:
      "1": {meaning: Employee Class, values: {A: Tenure/Tenure Track Faculty, B: Other Academics, C: "Assistants & Fellows", D: Practicing Faculty}}
      "2": {meaning: Service Reference, values: {A: 9 Month, B: 10 Month, C: 12 Month, D: "< 9 Month", E: Non Service, F: Hourly, G-Z: Reserved for Growth}}
      "3": {meaning: Rank, values: {A: Professor, B: Associate Professor, C: Assistant Professor, D: Instructor, E: Lecturer, F: Scholar, G: Artist-In-Residence, H: Inst/ Dept. Affiliate, J: Associate (non student), K: Post Doc Research Assoc, L: Patient Care, M: Resident, N: Intern/Extern, P: Librarian, Q: Education Specialist, R: Trainee, S: Grad Appt, T: UnderGrad Appt, U: Post Doc Fellow, V: Pre Doc Fellow, W: Assistant (non student), X-Z: Reserved for Growth}}
      "4": {meaning: Rank modifier, values: {A: N/A, B: Extension, C: Library, D: Military, E: "Endowed, Named or Distinguished", F: Clinical, G: Research, H: Teaching, J: Medical, K: Pharmacy, L: Non-Medical Intern, M: Physical Therapy, N: Senior, Q: Extension/Teaching, R: Dental, V: Veterinary Resident/Intern, W: Teaching/Research, X: Pre-Professional, Y: Teaching Required, Z: Resident Advisor/Counselor}}
      "5": {meaning: Status Modifier, values: {A: N/A, B: Interim, C: Acting, D: Adjunct, E: Visiting Adjunct, F: Visiting, G: Emerita/us, H: Retire/Rehire, J-Z: Reserved for Growth}}
    exception: "Per Change Request - as of 2/20/08 these rules are not strictly followed for B**** & C**** P-Classes (esp. in terms of the segment order of the description)."
    reporting_rules:   # rc2009 p1 (2009)
      source: rc2009
      professor: "E-Class begins with A, P-Class 1st char = A, 3rd char = A (or rank table Institutional Rank Code 1; 4 = Research Professor)"
      associate_professor: "E-Class begins with A, P-Class 1st char = A, 3rd char = B (or Institutional Rank Code 2; 5 = Research Associate Professor)"
      assistant_professor: "E-Class begins with A, P-Class 1st char = A, 3rd char = C (or Institutional Rank Code 3)"
      rank_modifier: "P-Class 1st char A, B or C; 4th char"
      status_modifier: "P-Class 1st char A, B or C; 5th char"
      adjunct: "5th char = D"
      interim: "5th char = B"
      acting: "5th char = C"
      visiting: "5th char = F"
      visiting_adjunct: "5th char = E"
      emeritus: "5th char = G"
  academic_professional:
    positions:
      "1": {meaning: Title Designation, values: {A-D: Reserved for Faculty and Other Academic Position Class Codes, E: President, F: Vice President, G: Chancellor, H: Provost, J: Vice Chancellor, K: Vice Provost, L: Dean, M: "Executive Director (Exec. Level)", N: Director, P: Department Head, Q: Unique Administrator Title, R: Coordinator, S: Specialist, T: Unique Professional Title, U: Department Chair, V-Z: Reserved for Growth}}
      "2": {meaning: Title Modifier, values: {A: N/A, B: Executive, C: Executive Associate, D: Executive Assistant, E: Associate, F: Assistant, G: Senior, H: Sr. Associate, J: Sr. Assistant, K: Executive Asst. to, L: Asst. to, M: Asst. to, N: Asst. to Associate, P: Asst. to Assistant, Q: Principal, R: Deputy, S: Vice, T: Lead, U-Z: Reserved for Growth}}
