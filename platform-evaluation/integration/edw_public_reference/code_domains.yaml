# Code values and coding rules for University of Illinois HR data, from PUBLIC sources only.
#
# Every group names its source key(s) (see sources.yaml). A value-level `source` overrides the group.
# `confidence` follows README.md: high = value printed in a fully read document or KB article;
# medium = rule stated in a full document but the EDW column holding it is inferred; low = snippet only.
# Dates matter: rc2009 is from 2009, the job aids from 2008-2016, the KB articles were updated in 2024-2026.
# Where an older and a newer source disagree, both are kept under `drift`.
#
# These are Banner HR code domains as described for reporting. That the EDW stores the same codes in
# the columns named in field_inventory.csv is stated for some fields (rc2009) and inferred for others.

domains_version: "1.0"
retrieval_date: "2026-11-06"

# --------------------------------------------------------------------------------------------- E-Class
e_class:
  description: Two-character employee class. Found at person (Employee History 1), position (Position History) and job (Job Detail History 1) level (rc2009 footnote 4).
  source: kb120378
  also_in: [eclass2015]
  confidence: high
  columns: ["V_EMPEE_HIST_1.EMPEE_CLS_CD (person level)", "T_POSN_HIST.POSN_EMPEE_CLS_CD (position level)", "V_JOB_DETL_HIST_1.JOB_DETL_EMPEE_CLS_CD (job level)"]
  legend: {"<9mth": works less than 9 months, "9/9mth": works 9 months paid over 9, "9/12mth": works 9 months paid over 12, "10/10mth": works 10 paid over 10, "10/12mth": works 10 paid over 12, "12mth": works 12 paid over 12, "75Hr/pay": 75-hour pay period, "80Hr/pay": 80-hour pay period, ExA: Exempt A, ExC: Exempt C, N/E: Non-Exempt, FS: Feeder System, IN: Ineligible}
  standard_dates: {"9/9 and 9/12 service": "August 16 - May 15", "12 month service": "August 16 - August 15"}
  groups:
    faculty:
      AA: {desc: "Acad 9/12mth Ben Elig", job_end_date: Standard, leave_category: A3}
