name: hr_public
description: 'Governed metrics over public IPEDS, BLS QCEW, Census QWI, O*NET, SUCSS and Anthropic Economic Index tables.
  Every metric declares its grain, its additivity and the rows it must never double count. Status: development. Generated
  from hr_public.yaml sha256 102bec2ac50cb4a9.'
tables:
- name: institution
  description: 'IPEDS institutional characteristics (HD2024). Grain: one row per IPEDS institution (unitid).'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: IPEDS_INSTITUTION
  primary_key:
    columns:
    - unitid
  dimensions:
  - name: institution_name
    expr: institution_name
    data_type: VARCHAR
    description: Institution name as published in IPEDS HD.
    synonyms:
    - institution
    - institutions
    - college
    - colleges
    - university
    - universities
    - school
    - schools
    - campus
    - campuses
    sample_values:
    - University of Illinois Urbana-Champaign
    - University of Illinois Chicago
    - University of Illinois Springfield
    is_enum: false
  - name: state
    expr: state_abbr
    data_type: VARCHAR
    description: Institution state (postal abbreviation).
    synonyms:
    - state
    - states
    sample_values:
    - IL
    - IN
    - WI
    - MI
    - IA
    - MO
    is_enum: false
  - name: sector
    expr: sector_code
    data_type: VARCHAR
    description: IPEDS sector code (1 public 4-year+, 2 private nonprofit 4-year+, 3 private for-profit 4-year+, 4 public
      2-year ...).
    synonyms:
    - sector
    - sectors
    - control
    - institution type
    sample_values:
    - '1'
    - '2'
    - '3'
    - '4'
    is_enum: false
  - name: carnegie
    expr: carnegie
    data_type: VARCHAR
    description: Carnegie classification label as loaded (HD2024).
    synonyms:
    - carnegie classification
    - carnegie class
    - carnegie
- name: staff_eap
  description: 'IPEDS Employees by Assigned Position (EAP), Fall snapshot. Includes total, subtotal and faculty-status rows
    (is_category_total = true) alongside the partition rows. Grain: one row per unitid x survey_year x eapcat_code (occupation
    category x faculty status).'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: IPEDS_EMPLOYEES_BY_POSITION
  primary_key:
    columns:
    - unitid
    - survey_year
    - eapcat_code
  synonyms:
  - eap
  - ipeds eap
  - employees by assigned position
  dimensions:
  - name: survey_year
    expr: survey_year
    data_type: NUMBER
    description: IPEDS EAP survey year = Fall snapshot year (EAP2023 = Fall 2023).
    synonyms:
    - survey year
  - name: unitid
    expr: unitid
    data_type: VARCHAR
    description: IPEDS unit id (also used to align populations in derived ratios).
    synonyms:
    - unitid
    - unit id
  - name: position_category
    expr: position_category
    data_type: VARCHAR
    description: EAP position category. Non-total rows (is_category_total = false) partition the institution total exactly
      (lake contract rule 4), so grouped rows are additive.
    synonyms:
    - position category
    - position categories
    - occupation category
    - occupational category
    - job category
    - job categories
    sample_values:
    - Instructional staff, total
    - Management
    - Computer, Engineering, and Science
    - Research
    - Office and Administrative Support
    is_enum: false
  - name: category_total_row
    expr: is_category_total
    data_type: BOOLEAN
    description: TRUE for published total / subtotal / faculty-status rows; FALSE rows form the exact partition.
    synonyms:
    - category total row
  metrics:
  - name: staff_headcount
    expr: CASE WHEN COUNT(DISTINCT survey_year) <= 1 THEN SUM(CASE WHEN (is_category_total = FALSE) THEN total_employees END)
      END
    description: 'Full-time plus part-time employees reported in IPEDS EAP for one Fall snapshot. Grain rule: Snapshot stock.
      One survey year at a time. Sums only is_category_total = false rows (exact partition of the institution total); never
      adds total/subtotal rows.'
    synonyms:
    - staff headcount
    - headcount
    - employees
    - employee headcount
    - staff count
    - number of staff
    - number of employees
    - staff
    - workforce
    - employee count
  - name: full_time_staff_headcount
    expr: CASE WHEN COUNT(DISTINCT survey_year) <= 1 THEN SUM(CASE WHEN (is_category_total = FALSE) THEN full_time END) END
    description: 'Full-time employees reported in IPEDS EAP for one Fall snapshot. Grain rule: Snapshot stock; one survey
      year at a time; same category rules as staff_headcount.'
    synonyms:
    - full-time staff
    - full time staff
    - full-time employees
    - full time employees
    - full-time headcount
    - full-time staff headcount
    - full time staff headcount
  - name: staff_fte
    expr: CASE WHEN COUNT(DISTINCT survey_year) <= 1 THEN SUM(CASE WHEN (is_category_total = FALSE) THEN full_time + part_time
      / 3.0 END) END
    description: 'IPEDS FTE convention = full-time + one third of part-time. Not payroll FTE. Grain rule: Snapshot stock;
      FTE is not headcount. One survey year at a time.'
    synonyms:
    - staff fte
    - fte
    - full-time equivalent
    - full time equivalent
    - fte staff
    - full-time equivalent staff
- name: salary_instructional
  description: 'IPEDS SAL_IS full-time instructional staff salary outlays by rank and contract length. Grain: one row per
    unitid x survey_year x arank_code x contract_length.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: IPEDS_SALARY_INSTRUCTIONAL
  primary_key:
    columns:
    - unitid
    - survey_year
    - arank_code
    - contract_length
  synonyms:
  - sal_is
  - ipeds salary survey
  dimensions:
  - name: survey_year
    expr: survey_year
    data_type: NUMBER
    description: IPEDS salary survey year (SAL2023 = academic year 2023-24).
    synonyms:
    - survey year
  - name: academic_rank
    expr: academic_rank
    data_type: VARCHAR
    description: Academic rank (no published all-ranks row; ranks partition staff).
    synonyms:
    - rank
    - ranks
    - academic rank
    - faculty rank
    sample_values:
    - Professor
    - Associate professor
    - Assistant professor
    - Instructor
    - Lecturer
    is_enum: false
  - name: contract_length
    expr: contract_length
    data_type: VARCHAR
    description: Contract length (9-, 10-, 11-, 12-month). Partitions staff; salaries are not comparable across lengths.
    synonyms:
    - contract length
    - contract
    sample_values:
    - 9-month
    - 12-month
    is_enum: false
  metrics:
  - name: instructional_staff_count
    expr: CASE WHEN COUNT(DISTINCT survey_year) <= 1 THEN SUM(staff_count) END
    description: 'Full-time instructional staff counted in the salary survey, all contract lengths (differs from EAP instructional
      headcount). Grain rule: Snapshot stock; ranks and contract lengths partition staff and are additive.'
    synonyms:
    - faculty count
    - number of faculty
    - instructional staff count
    - full-time faculty
  - name: avg_instructional_salary
    expr: CAST(SUM(CASE WHEN (contract_length = '9-month') THEN salary_outlays END) AS DOUBLE) / NULLIF(SUM(CASE WHEN (contract_length
      = '9-month') THEN staff_count END), 0)
    description: 'Salary outlays divided by full-time instructional staff at the requested grain; 9-month contracts unless
      another contract length is requested. Grain rule: Ratio of sums. Never average institution averages, never mix contract
      lengths, never sum salaries across a join fan-out.'
    synonyms:
    - average faculty salary
    - average instructional salary
    - faculty salary
    - faculty salaries
    - mean faculty salary
    - instructional salary
- name: salary_noninstructional
  description: 'IPEDS SAL_NIS full-time non-instructional staff salary outlays (13 categories that partition staff). Grain:
    one row per unitid x survey_year x occupation_category_code.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: IPEDS_SALARY_NONINSTRUCTIONAL
  primary_key:
    columns:
    - unitid
    - survey_year
    - occupation_category_code
  synonyms:
  - sal_nis
  dimensions:
  - name: survey_year
    expr: survey_year
    data_type: NUMBER
    description: IPEDS salary survey year (SAL2023 = 2023-24).
    synonyms:
    - survey year
  - name: occupation_category
    expr: occupation_category
    data_type: VARCHAR
    description: Non-instructional occupation category (partition; no total row).
    synonyms:
    - occupation category
    - occupation categories
    - staff category
    - staff categories
    sample_values:
    - Management
    - Computer, engineering and science
    is_enum: false
  metrics:
  - name: avg_noninstructional_salary
    expr: CAST(SUM(salary_outlays) AS DOUBLE) / NULLIF(SUM(staff_count), 0)
    description: 'Non-instructional salary outlays divided by full-time non-instructional staff. Grain rule: Ratio of sums
      at the requested grain.'
    synonyms:
    - average staff salary
    - average non-instructional salary
    - average noninstructional salary
    - non-instructional salary
    - staff salary
  - name: noninstructional_salary_outlays
    expr: SUM(salary_outlays)
    description: 'Total salary outlays for full-time non-instructional staff. Grain rule: Additive across institutions and
      the 13 categories (they partition staff).'
    synonyms:
    - salary outlays
    - non-instructional salary outlays
    - staff payroll
    - payroll
- name: enrollment
  description: 'IPEDS EFFY 12-month unduplicated enrollment by student level (levels nest). Grain: one row per unitid x survey_year
    x level_code.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: IPEDS_ENROLLMENT_12MO
  primary_key:
    columns:
    - unitid
    - survey_year
    - level_code
  synonyms:
  - effy
  dimensions:
  - name: survey_year
    expr: survey_year - 1
    data_type: NUMBER
    description: ALIGNED fall-year label. EFFY N covers academic year (N-1)-(N), so EFFY2024 (2023-24) is labelled 2023 to
      align with the EAP Fall 2023 snapshot.
    synonyms:
    - survey year
  - name: unitid
    expr: unitid
    data_type: VARCHAR
    description: IPEDS unit id.
    synonyms:
    - unitid
    - unit id
  - name: effy_year
    expr: survey_year
    data_type: NUMBER
    description: Raw EFFY survey year as published (EFFY2024 = 2023-24).
    synonyms:
    - effy year
  - name: student_level
    expr: level_code
    data_type: VARCHAR
    description: EFFY student level code (1 all students, 2 undergraduate, 12 graduate). Levels nest.
    synonyms:
    - student level
    - level
    - levels
    sample_values:
    - '2'
    - '12'
    is_enum: false
  metrics:
  - name: enrollment_12mo
    expr: CASE WHEN COUNT(DISTINCT survey_year - 1) <= 1 THEN SUM(CASE WHEN (level_code = '1') THEN enrollment_total END)
      END
    description: 'IPEDS EFFY unduplicated headcount for the 12-month period, all students unless a level is requested. Grain
      rule: Do not sum across years (students recur) or across nested levels.'
    synonyms:
    - enrollment
    - enrolment
    - students
    - student headcount
    - 12-month enrollment
    - unduplicated enrollment
  filters:
  - name: exclude_student_level_total
    expr: level_code <> '1'
    description: Levels nest under 'All students total' (1).
- name: qcew
  description: 'BLS QCEW. Union of the national/state/county NAICS 611310 file and the IL county all-industry file, excluding
    industry_code ''611310'' from the county file (those rows duplicate the industry file; lake contract rule 7). Grain: one
    row per area_fips x own_code x industry_code x year x qtr.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: QCEW_COMBINED
  primary_key:
    columns:
    - area_fips
    - own_code
    - industry_code
    - year
    - qtr
  synonyms:
  - qcew
  - bls qcew
  - quarterly census of employment and wages
  dimensions:
  - name: year
    expr: year
    data_type: NUMBER
    description: Calendar year.
    synonyms:
    - calendar year
  - name: quarter
    expr: qtr
    data_type: NUMBER
    description: Calendar quarter 1-4.
    synonyms:
    - calendar quarter
  - name: area
    expr: area_fips
    data_type: VARCHAR
    description: QCEW area FIPS (US000 national, 17000 Illinois statewide, 5-digit counties).
    synonyms:
    - area
    - areas
    - county
    - counties
    - geography
    sample_values:
    - US000
    - '17000'
    - '17019'
    - '17031'
    - '17167'
    is_enum: false
  - name: ownership
    expr: own_code
    data_type: VARCHAR
    description: QCEW ownership code (0 total covered, 1 federal, 2 state, 3 local, 5 private).
    synonyms:
    - ownership
    - owner
    - public or private
    sample_values:
    - '1'
    - '2'
    - '3'
    - '5'
    is_enum: false
  - name: industry
    expr: industry_code
    data_type: VARCHAR
    description: NAICS industry code (nested levels in the county file).
    synonyms:
    - industry
    - industries
    - naics
    sample_values:
    - '611310'
    - '10'
    is_enum: false
  metrics:
  - name: qcew_employment
    expr: CAST(CASE WHEN COUNT(CASE WHEN (own_code <> '0') AND (industry_code = '611310') THEN 1 END) = COUNT(CASE WHEN (own_code
      <> '0') AND (industry_code = '611310') THEN (month1_emplvl + month2_emplvl + month3_emplvl) / 3.0 END) THEN SUM(CASE
      WHEN (own_code <> '0') AND (industry_code = '611310') THEN (month1_emplvl + month2_emplvl + month3_emplvl) / 3.0 END)
      END AS DOUBLE) / NULLIF(COUNT(DISTINCT CONCAT(CAST(year AS STRING), '-', CAST(qtr AS STRING))), 0)
    description: 'Covered employment, average of the three monthly levels; averaged over quarters for a year. Returns NULL
      when any contributing cell is disclosure-suppressed. Grain rule: Stock. Sum across ownership members within one area;
      average (not sum) over quarters. Area must be chosen. Suppressed cells propagate as NULL instead of silently understating.'
    synonyms:
    - qcew employment
    - covered employment
    - jobs
    - employment
    - employees
    - employment level
  - name: qcew_total_wages
    expr: CASE WHEN COUNT(CASE WHEN (own_code <> '0') AND (industry_code = '611310') THEN 1 END) = COUNT(CASE WHEN (own_code
      <> '0') AND (industry_code = '611310') THEN total_qtrly_wages END) THEN SUM(CASE WHEN (own_code <> '0') AND (industry_code
      = '611310') THEN total_qtrly_wages END) END
    description: 'Total covered quarterly wages, additive over quarters. NULL when any contributing cell is suppressed. Grain
      rule: Flow. Sum over quarters and ownership members within one area; suppressed cells propagate as NULL.'
    synonyms:
    - total wages
    - qcew wages
    - wages paid
    - quarterly wages
  filters:
  - name: exclude_ownership_total
    expr: own_code <> '0'
    description: Ownership 0 is the total of the other codes where published.
- name: qwi
  description: 'Census QWI, Illinois, NAICS 6113, by sex x age group (published totals sex 0 / agegrp A00). Grain: one row
    per geography x industry x ownercode x year x quarter x sex x agegrp.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: QWI_HIGHER_ED
  primary_key:
    columns:
    - geography
    - industry
    - ownercode
    - year
    - quarter
    - sex
    - agegrp
  synonyms:
  - qwi
  - census qwi
  - quarterly workforce indicators
  dimensions:
  - name: year
    expr: year
    data_type: NUMBER
    description: Calendar year.
    synonyms:
    - calendar year
  - name: quarter
    expr: quarter
    data_type: NUMBER
    description: Calendar quarter 1-4.
    synonyms:
    - calendar quarter
  - name: geography
    expr: geography
    data_type: VARCHAR
    description: QWI geography (2-digit state FIPS; counties if loaded).
    synonyms:
    - geography
    sample_values:
    - '17'
    is_enum: false
  - name: industry
    expr: industry
    data_type: VARCHAR
    description: NAICS industry code.
    synonyms:
    - industry
    - naics
    sample_values:
    - '6113'
    is_enum: false
  - name: ownership
    expr: ownercode
    data_type: VARCHAR
    description: QWI ownership code (A00 all).
    synonyms:
    - ownership
  - name: sex
    expr: sex
    data_type: VARCHAR
    description: QWI sex code (0 all, 1 male, 2 female).
    synonyms:
    - sex
    - gender
    sample_values:
    - '1'
    - '2'
    is_enum: false
  - name: age_group
    expr: agegrp
    data_type: VARCHAR
    description: QWI age group (A00 all ages, A01 14-18 ... A08 65-99).
    synonyms:
    - age group
    - age groups
    - age
  metrics:
  - name: qwi_employment
    expr: CAST(CASE WHEN COUNT(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry = '6113') AND
      (ownercode = 'A00') THEN 1 END) = COUNT(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry
      = '6113') AND (ownercode = 'A00') THEN emp END) THEN SUM(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp =
      'A00') AND (industry = '6113') AND (ownercode = 'A00') THEN emp END) END AS DOUBLE) / NULLIF(COUNT(DISTINCT CONCAT(CAST(year
      AS STRING), '-', CAST(quarter AS STRING))), 0)
    description: 'Census QWI Emp (beginning-of-quarter jobs); averaged over quarters. Grain rule: Stock; average over quarters;
      all-sex/all-age row by default.'
    synonyms:
    - qwi employment
    - beginning of quarter employment
    - employment
    - employees
    - jobs
  - name: qwi_hires
    expr: CASE WHEN COUNT(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry = '6113') AND (ownercode
      = 'A00') THEN 1 END) = COUNT(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry = '6113')
      AND (ownercode = 'A00') THEN hira END) THEN SUM(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND
      (industry = '6113') AND (ownercode = 'A00') THEN hira END) END
    description: 'Census QWI HirA, summed over quarters; NULL if any quarter is not yet published. Grain rule: Flow; additive
      over quarters.'
    synonyms:
    - hires
    - hiring
    - new hires
    - all hires
  - name: qwi_separations
    expr: CASE WHEN COUNT(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry = '6113') AND (ownercode
      = 'A00') THEN 1 END) = COUNT(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry = '6113')
      AND (ownercode = 'A00') THEN sep END) THEN SUM(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND
      (industry = '6113') AND (ownercode = 'A00') THEN sep END) END
    description: 'Census QWI Sep, summed over quarters; NULL if any quarter is not yet published (latest quarter lags). Grain
      rule: Flow; additive over quarters.'
    synonyms:
    - separations
    - exits
    - departures
  - name: qwi_avg_monthly_earnings
    expr: CAST(SUM(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp = 'A00') AND (industry = '6113') AND (ownercode
      = 'A00') THEN earns * emp_s END) AS DOUBLE) / NULLIF(SUM(CASE WHEN (geography = '17') AND (sex = '0') AND (agegrp =
      'A00') AND (industry = '6113') AND (ownercode = 'A00') THEN CASE WHEN earns IS NOT NULL THEN emp_s END END), 0)
    description: 'EarnS weighted by EmpS over the requested grain (quarters without published earnings excluded from both
      sides). Grain rule: Employment-weighted ratio; never average the published averages.'
    synonyms:
    - average monthly earnings
    - monthly earnings
    - earnings
  filters:
  - name: exclude_sex_total
    expr: sex <> '0'
    description: Use the published all-sex row.
  - name: exclude_age_group_total
    expr: agegrp <> 'A00'
    description: Use the published all-ages row.
- name: onet_occupation
  description: 'O*NET 31.0 occupations. Grain: one row per O*NET-SOC occupation.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: ONET_OCCUPATION
  primary_key:
    columns:
    - onetsoc_code
  synonyms:
  - o*net
  - onet
  dimensions:
  - name: occupation_title
    expr: title
    data_type: VARCHAR
    description: O*NET occupation title.
    synonyms:
    - occupation
    - occupations
    - occupation title
    sample_values:
    - Database Administrators
    - Postsecondary Teachers, All Other
    is_enum: false
  - name: occupation_code
    expr: onetsoc_code
    data_type: VARCHAR
    description: O*NET-SOC code.
    synonyms:
    - onet code
    - soc code
    - occupation code
  metrics:
  - name: occupation_count
    expr: COUNT(DISTINCT onetsoc_code)
    description: 'Distinct O*NET-SOC occupations. Grain rule: Count distinct; not additive across groupings.'
    synonyms:
    - occupation count
    - number of occupations
    - onet occupations
    - o*net occupations
- name: onet_task
  description: 'O*NET task statements. Grain: one row per onetsoc_code x task_id.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: ONET_TASK_STATEMENT
  primary_key:
    columns:
    - onetsoc_code
    - task_id
  dimensions:
  - name: task_type
    expr: task_type
    data_type: VARCHAR
    description: Core, Supplemental or n/a.
    synonyms:
    - task type
    sample_values:
    - Core
    - Supplemental
    is_enum: false
  metrics:
  - name: task_statement_count
    expr: COUNT(*)
    description: 'Number of task statements (rows). Grain rule: Additive across occupations.'
    synonyms:
    - task count
    - task statements
    - number of tasks
    - tasks
  - name: core_task_count
    expr: COUNT(CASE WHEN (task_type = 'Core') THEN 1 END)
    description: 'Task statements typed Core. Grain rule: Additive; metric-level filter task_type = ''Core''.'
    synonyms:
    - core tasks
    - core task count
    - number of core tasks
- name: aei_task_usage
  description: 'Anthropic Economic Index task usage percentage by release (lower-cased O*NET task text). Grain: one row per
    task_name x release.'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: AEI_TASK_USAGE
  primary_key:
    columns:
    - task_name
    - release
  synonyms:
  - aei
  - anthropic economic index
  - economic index
  dimensions:
  - name: release
    expr: release
    data_type: VARCHAR
    description: AEI data release label.
    synonyms:
    - release
    - releases
    sample_values:
    - release_2025_03_27
    - labor_market_impacts
    is_enum: false
  metrics:
  - name: ai_task_usage_pct
    expr: SUM(usage_pct)
    description: 'Sum of AEI usage percentages for tasks within ONE release. Usage is not automation, displacement or obsolescence.
      Grain rule: Additive across tasks within a release only; cannot be sliced by occupation (task-text join fans out).'
    synonyms:
    - ai usage share
    - ai usage percentage
    - ai task usage
    - ai usage
    - economic index usage
- name: sucss_class
  description: 'Illinois SUCSS civil-service class catalog records (not employees, not vacancies). Grain: one row per source
    class record (a class code can have several records).'
  base_table:
    database: HR_ANALYTICS
    schema: HR_PUBLIC
    table: SUCSS_CLASS
  primary_key:
    columns:
    - source_record_id
  synonyms:
  - sucss
  dimensions: []
  metrics:
  - name: sucss_class_record_count
    expr: COUNT(*)
    description: 'Catalog records. A class code can have several records (e.g. 1164); records are not employees or vacancies.
      Grain rule: Count rows.'
    synonyms:
    - class records
    - sucss class records
    - civil service class records
    - catalog records
  - name: sucss_class_code_count
    expr: COUNT(DISTINCT class_code)
    description: 'Distinct civil-service class codes. Grain rule: Count distinct; differs from record count where a code has
      multiple records.'
