- name: il_staff_headcount_2023
  question: What was the staff headcount in Illinois in 2023?
  sql: "SELECT\n  SUM(staff_eap.total_employees) AS \"staff_headcount\"\nFROM __staff_eap AS staff_eap\nLEFT JOIN __institution\
    \ AS institution ON staff_eap.unitid = institution.unitid\nWHERE institution.state_abbr = 'IL'\n  AND staff_eap.survey_year\
    \ = 2023\n  AND staff_eap.is_category_total = FALSE"
  verified_at: 1793923200
  verified_by: custom_stack author against the real lake (146119; EAP2023 'All staff' rows, IL)
  use_as_onboarding_question: false
- name: fte_by_sector_2023
  question: Staff FTE by sector in 2023
  sql: "SELECT\n  institution.sector_code AS \"sector\",\n  SUM(staff_eap.full_time + staff_eap.part_time / 3.0) AS \"staff_fte\"\
    \nFROM __staff_eap AS staff_eap\nLEFT JOIN __institution AS institution ON staff_eap.unitid = institution.unitid\nWHERE\
    \ staff_eap.survey_year = 2023\n  AND staff_eap.is_category_total = FALSE\nGROUP BY 1\nORDER BY \"sector\""
  verified_at: 1793923200
  verified_by: custom_stack author (fixture + real lake run; not domain-owner approved)
  use_as_onboarding_question: false
- name: il_qcew_employment_2024
  question: QCEW employment in Illinois in 2024
  sql: "WITH per_period AS (\n  SELECT\n    qcew.year AS \"__period_year\",\n    qcew.qtr AS \"__period_quarter\",\n    CASE\
    \ WHEN COUNT(*) = COUNT((qcew.month1_emplvl + qcew.month2_emplvl + qcew.month3_emplvl) / 3.0) THEN SUM((qcew.month1_emplvl\
    \ + qcew.month2_emplvl + qcew.month3_emplvl) / 3.0) END AS __v\n  FROM __qcew AS qcew\n  WHERE qcew.area_fips = '17000'\n\
    \    AND qcew.year = 2024\n    AND qcew.own_code <> '0'\n    AND qcew.industry_code = '611310'\n  GROUP BY 1, 2\n)\nSELECT\n\
    \  CASE WHEN COUNT(*) = COUNT(__v) THEN AVG(__v) END AS \"qcew_employment\"\nFROM per_period"
  verified_at: 1793923200
  verified_by: custom_stack author (fixture + real lake run; not domain-owner approved)
  use_as_onboarding_question: false
