# NL evaluation set for governed-metric question answering (custom stack,
# Snowflake Cortex Analyst, Databricks Genie). VISIBLE DEVELOPMENT SET: the
# custom planner's synonyms were written while these questions were visible,
# so scores on this file are NOT a blind/holdout result (rubric v1.0 asks for
# separately authored held-out questions before any generalisation claim).
#
# expected.status: answer | clarify | abstain
#   answer  -> expected.plan (structured, for exact-plan scoring of the custom
#              planner) and optionally expected.result (hand-computed rows;
#              when absent, the reference result is the expected plan compiled
#              and executed on the same data snapshot)
#   clarify -> expected.clarify_kind: metric | time | dimension (informational)
#   abstain -> expected.reason (informational)
# Result comparison ignores row order, column order and column names; numbers
# must match within 1e-6 absolute (no rounded display values).
version: 1
data:
  hr_public: synthetic fixture custom_stack/tests/fixtures/contract (contract-shaped, hand-checkable values);
    the same questions also run against the real lake (data/lake/contract) where only behaviour and
    executed-expected-plan equality are scored, because hand-fixed values are fixture-specific
  benchmark_workforce: frozen benchmark v1.0 fixtures (README fixed outputs)
questions:
  # ---------------------------------------------------------------- answers
  - id: Q01
    model: hr_public
    category: metric+join+time
    question: What was the staff headcount in Illinois in 2023?
    expected:
      status: answer
      plan: {metric: staff_headcount, dimensions: [], filters: [{dimension: state, op: eq, value: IL}, {dimension: survey_year, op: eq, value: 2023}]}
      result: [[293]]
  - id: Q02
    model: hr_public
    category: metric+join+time
    question: Staff FTE by sector in 2023
    expected:
      status: answer
      plan: {metric: staff_fte, dimensions: [sector], filters: [{dimension: survey_year, op: eq, value: 2023}]}
      result: [["1", 296.0], ["4", 38.333333333333336]]
  - id: Q03
    model: hr_public
    category: metric+join+time
    question: Full-time staff headcount at public four-year institutions in 2023
