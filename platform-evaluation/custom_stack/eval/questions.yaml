      result: [[275]]
  - id: Q04
    model: hr_public
    category: ranking
    question: Top 2 institutions by staff headcount in 2023
    expected:
      status: answer
      plan: {metric: staff_headcount, dimensions: [institution_name], filters: [{dimension: survey_year, op: eq, value: 2023}], order_by: {field: staff_headcount, direction: desc}, limit: 2}
      result: [["Fixture Flagship University", 150], ["Fixture Neighbor University", 110]]
